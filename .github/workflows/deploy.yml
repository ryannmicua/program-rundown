name: test-build-deploy
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Public PR code must never execute on a runner with deployment credentials.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  image:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    # Hosted trusted builds also work before repository-scoped runners exist.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          tags: ghcr.io/ryannmicua/program-rundown:sha-${{ github.sha }}
      - name: Record immutable image
        env:
          COMMIT: ${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Commit: %s\nImage: ghcr.io/ryannmicua/program-rundown@%s\n' "$COMMIT" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy_dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEV_DEPLOY_HOST != '' && vars.DEV_DEPLOY_BRANCH == 'main'
    needs: build
    runs-on: [self-hosted, linux, deploy-dev]
    environment: dev
    # Serialize all app deployments; do not cancel migrations or deploy-app.
    concurrency:
      group: program-rundown-dev-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy immutable image
        env:
          DEV_DEPLOY_HOST: ${{ vars.DEV_DEPLOY_HOST }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          test -n "$DEV_DEPLOY_HOST"
          test -n "$IMAGE_DIGEST"
          printf '%s' "$REGISTRY_TOKEN" |
            ssh -F "$HOME/.ssh/dev-platform-deploy.conf" "dev@$DEV_DEPLOY_HOST" \
              deploy-app program-rundown "ghcr.io/ryannmicua/program-rundown@$IMAGE_DIGEST"
          printf 'Deployed commit: %s\nImage: ghcr.io/ryannmicua/program-rundown@%s\n' "$COMMIT" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
